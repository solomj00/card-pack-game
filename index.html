<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Card Opening Game</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header>
    <h1 id="setName">Card Set</h1>
    <div class="stats">
      <div class="stat"><b id="sPacks">0</b> packs</div>
      <div class="stat"><b id="sFound">0</b> / <span id="sTotal">0</span> found</div>
      <div class="stat"><b id="sBest">—</b> best pull</div>
      <button class="icon-btn" id="sound" aria-pressed="true">Sound: on</button>
    </div>
  </header>

  <!-- The pack and the opened cards appear here -->
  <canvas id="confetti" aria-hidden="true"></canvas>
  <main class="stage" id="stage"></main>

  <section class="binder">
    <div class="inner">
      <div class="binder-head">
        <h2>Binder</h2>
        <div class="filters" id="filters"></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="actions"><button class="btn alt" id="reset">Reset collection</button></div>
    </div>
  </section>

  <!-- Load order matters: your cards first, then the game -->
  <script src="cards.js?v=3"></script>
  <script src="game.js?v=3"></script>
</body>
</html>
